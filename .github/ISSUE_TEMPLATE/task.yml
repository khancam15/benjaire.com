name: Task
description: A feature, content change or maintenance item.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ...\n- [ ] npm run ci passes"
