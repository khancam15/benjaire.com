# GitHub Pages (Jekyll) settings for the live root site.
# Keep the new Astro site, planning docs and tooling out of the published
# site: .astro files start with front matter that Jekyll would try to parse,
# and docs/ is internal planning material.
exclude:
  - site/
  - docs/
  - scripts/
  - README.md
  - CONTRIBUTING.md
  - security-audit.sh
